legal.terms=Terms of Service
legal.privacy=Privacy Policy
legal.help=Help
legal.terms_body=MIYAV is a community platform for finding homes for pets. Anyone can browse listings without an account. Posting, applying and contacting owners need an account. Listing owners are responsible for the accuracy of their listings. Selling animals and fake or abusive listings are not allowed and are removed; accounts that break these rules are suspended.
legal.privacy_body=While you browse as a guest no account data is collected; favourites stay on this device and are never moved to an account without your consent. When you create an account, your email, name and profile details are stored. Your email address and messages are never shown publicly. Listing locations are rounded to about 100 metres. Your phone number is shown only if you allow it, and only to signed-in users. You can delete your account at any time from Profile → Delete account: your profile, listings, applications, messages and photos are removed permanently.
legal.help_body=Use search and filters to find listings. Tap the heart to keep a pet in your favourites. To adopt, tap "Apply" on a listing; if you have no account yet, you return to the same application right after a short sign-up.
