user.payout.agreement_text=MIYAV walker agreement (version 2026-11-10)\n\n1. Parties. This agreement is between the MIYAV platform and the member who walks pets through it (the Walker).\n\n2. Service. The Walker does each accepted walk at the agreed time and length and follows the owner's instructions.\n\n3. Safety. The Walker never leaves the pet unattended, does not unleash it without the owner's permission, and immediately tells the owner and MIYAV support about any incident.\n\n4. Payment. The fee is calculated from the hourly price agreed in the app and paid to the bank account (IBAN) the Walker provides, minus a 10% service fee. The Walker is responsible for the bank details being correct.\n\n5. Privacy. The Walker does not share the owner's address, phone number or other personal data with anyone.\n\n6. Rating. After every completed walk the owner can rate the Walker with 1–5 stars. Accounts that repeatedly break the rules can be suspended.\n\n7. Cancelling. The Walker may cancel an accepted walk only for a good reason and with timely notice to the owner.\n\n8. Changes. MIYAV may update this agreement; a new version has to be accepted again in the app.\n\nQuestions: support, WhatsApp +994 50 347 73 06.
