legal.help=Kömək
legal.terms_body=MIYAV heyvanlara yuva tapmaq üçün icma platformasıdır. Elanlara qeydiyyatsız baxmaq olar. Elan yerləşdirmək, müraciət etmək və əlaqə saxlamaq üçün hesab lazımdır. Elanlardakı məlumatın doğruluğuna elan sahibi cavabdehdir. Heyvan satışı, saxta və ya təhqiramiz elanlar qadağandır və silinir; qaydaları pozan hesablar dayandırılır. İstifadəçilərin təhlükəsizliyi və qaydaların icrası üçün MIYAV moderatorları söhbətləri və söhbətdəki şəkilləri oxuya bilər, məsələn şikayətdən sonra; hər yoxlama qeydə alınır. Premium elan 7 gün üçün 5 ₼-dır, ödəniş M10 və ya bank kartına köçürmə ilə edilir və admin çeki təsdiqlədikdən sonra başlayır.
legal.privacy_body=Qonaq kimi baxarkən hesab məlumatı toplanmır; seçilmişlər yalnız bu cihazda saxlanılır və sənin razılığın olmadan hesaba köçürülmür. Hesab yaradanda e-poçt, ad və profil məlumatın saxlanılır. E-poçt ünvanın və mesajların heç vaxt ictimai göstərilmir. Elan məkanı təxminən 100 metr dəqiqliklə yuvarlaqlaşdırılır. Telefon nömrən yalnız sən icazə versən və yalnız daxil olmuş istifadəçilərə göstərilir. Hesabını istənilən vaxt Profil → Hesabı sil bölməsindən silə bilərsən: profil, elanlar, müraciətlər, mesajlar və şəkillər birdəfəlik silinir. Mesajlar iki istifadəçi arasında gizlidir, lakin MIYAV moderatorları təhlükəsizlik və İstifadə şərtlərinin icrası üçün onları yoxlaya bilər; hər yoxlama qeydə alınır. Ödəniş çeklərini yalnız sən və administratorlar görür.
legal.help_body=Elan tapmaq üçün axtarış və filtrlərdən istifadə et. Bəyəndiyin heyvanı ürək işarəsi ilə seçilmişlərə əlavə et. Sahiblənmək üçün elanda "Müraciət et" düyməsinə toxun — hesabın yoxdursa, qısa qeydiyyatdan sonra elə həmin müraciətə qayıdacaqsan.
