user.payout.agreement_text=MIYAV gəzdirən müqaviləsi (versiya 2026-11-10)\n\n1. Tərəflər. Bu müqavilə MIYAV platforması ilə platformada heyvan gəzdirmə xidməti göstərən istifadəçi (Gəzdirən) arasında bağlanır.\n\n2. Xidmət. Gəzdirən qəbul etdiyi gəzintini razılaşdırılmış vaxtda, müddətdə və heyvan sahibinin göstərişlərinə uyğun keçirir.\n\n3. Təhlükəsizlik. Gəzdirən heyvanı nəzarətsiz qoymur, sahibin icazəsi olmadan qayışdan açmır və hər hansı hadisə barədə dərhal sahibə və MIYAV dəstək xidmətinə xəbər verir.\n\n4. Ödəniş. Gəzinti haqqı tətbiqdə razılaşdırılmış saatlıq qiymətlə hesablanır və Gəzdirənin göstərdiyi bank hesabına (IBAN) 10% xidmət haqqı çıxılmaqla köçürülür. Bank məlumatlarının düzgünlüyünə Gəzdirən cavabdehdir.\n\n5. Məxfilik. Gəzdirən sahibin ünvanını, əlaqə nömrəsini və digər şəxsi məlumatlarını üçüncü şəxslərlə paylaşmır.\n\n6. Reytinq. Hər tamamlanmış gəzintidən sonra sahib Gəzdirəni 1–5 ulduzla qiymətləndirə bilər. Qaydaları təkrar pozan hesablar dayandırıla bilər.\n\n7. Ləğv. Gəzdirən qəbul etdiyi gəzintini yalnız üzrlü səbəblə və sahibə vaxtında xəbər verməklə ləğv edə bilər.\n\n8. Dəyişikliklər. MIYAV bu müqaviləni yeniləyə bilər; yeni versiya tətbiqdə yenidən qəbul edilməlidir.\n\nSuallar üçün: dəstək xidməti, WhatsApp +994 50 347 73 06.
