user.payout.agreement_text=Договор выгульщика MIYAV (версия 2026-11-10)\n\n1. Стороны. Договор заключается между платформой MIYAV и пользователем, который выгуливает питомцев через неё (Выгульщик).\n\n2. Услуга. Выгульщик проводит каждую принятую прогулку в согласованное время и в согласованной продолжительности, следуя указаниям владельца.\n\n3. Безопасность. Выгульщик не оставляет питомца без присмотра, не спускает его с поводка без разрешения владельца и сразу сообщает владельцу и поддержке MIYAV о любом происшествии.\n\n4. Оплата. Стоимость рассчитывается по согласованной в приложении цене за час и переводится на указанный Выгульщиком банковский счёт (IBAN) за вычетом сервисного сбора 10%. Выгульщик отвечает за правильность банковских данных.\n\n5. Конфиденциальность. Выгульщик не передаёт третьим лицам адрес, телефон и другие личные данные владельца.\n\n6. Рейтинг. После каждой завершённой прогулки владелец может оценить Выгульщика от 1 до 5 звёзд. Аккаунты, неоднократно нарушающие правила, могут быть заблокированы.\n\n7. Отмена. Выгульщик может отменить принятую прогулку только по уважительной причине и своевременно предупредив владельца.\n\n8. Изменения. MIYAV может обновлять договор; новую версию нужно принять в приложении заново.\n\nВопросы: поддержка, WhatsApp +994 50 347 73 06.
