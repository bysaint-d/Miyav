console.settings_privacy_body=Панель никогда не показывает содержание сообщений, адреса эл. почты, телефоны, заметки по уходу и экстренные контакты. Места текущих прогулок округляются примерно до 1 км, метки объявлений — примерно до 100 м. Каждое действие модератора записывается в журнал администратора.
