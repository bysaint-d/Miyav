legal.help=Помощь
legal.terms_body=MIYAV — платформа сообщества, которая помогает найти дом для животных. Смотреть объявления можно без аккаунта. Для размещения объявлений, заявок и связи с владельцами нужен аккаунт. За достоверность объявления отвечает его владелец. Продажа животных, фальшивые и оскорбительные объявления запрещены и удаляются; аккаунты нарушителей блокируются. Ради безопасности пользователей и соблюдения правил модераторы MIYAV могут читать переписку и фото в чатах, например после жалобы; каждая проверка записывается. Премиум-объявление стоит 5 ₼ за 7 дней, оплата переводом на M10 или банковскую карту, и начинается после подтверждения чека администратором.
legal.privacy_body=В гостевом режиме данные аккаунта не собираются; избранное хранится только на этом устройстве и не переносится в аккаунт без вашего согласия. При создании аккаунта сохраняются эл. почта, имя и данные профиля. Адрес эл. почты и сообщения никогда не показываются публично. Местоположение объявлений округляется примерно до 100 метров. Номер телефона показывается только с вашего разрешения и только вошедшим пользователям. Аккаунт можно удалить в любой момент: Профиль → Удалить аккаунт. Профиль, объявления, заявки, сообщения и фото удаляются безвозвратно. Сообщения видны только двум участникам, но модераторы MIYAV могут проверять их ради безопасности и соблюдения Условий; каждая проверка записывается. Чеки об оплате видите только вы и администраторы.
legal.help_body=Используйте поиск и фильтры, чтобы найти объявления. Нажмите на сердечко, чтобы сохранить питомца в избранном. Чтобы усыновить, нажмите «Подать заявку» в объявлении; если аккаунта нет, после короткой регистрации вы вернётесь к той же заявке.
