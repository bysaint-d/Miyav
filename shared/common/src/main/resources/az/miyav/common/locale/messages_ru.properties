legal.help=Помощь
legal.terms_body=MIYAV — платформа сообщества, которая помогает найти дом для животных. Смотреть объявления можно без аккаунта. Для размещения объявлений, заявок и связи с владельцами нужен аккаунт. За достоверность объявления отвечает его владелец. Продажа животных, фальшивые и оскорбительные объявления запрещены и удаляются; аккаунты нарушителей блокируются.
legal.privacy_body=В гостевом режиме данные аккаунта не собираются; избранное хранится только на этом устройстве и не переносится в аккаунт без вашего согласия. При создании аккаунта сохраняются эл. почта, имя и данные профиля. Адрес эл. почты, Telegram id и сообщения никогда не показываются публично. Местоположение объявлений округляется примерно до 100 метров. Номер телефона показывается только с вашего разрешения и только вошедшим пользователям.
legal.help_body=Используйте поиск и фильтры, чтобы найти объявления. Нажмите на сердечко, чтобы сохранить питомца в избранном. Чтобы усыновить, нажмите «Подать заявку» в объявлении; если аккаунта нет, после короткой регистрации вы вернётесь к той же заявке.
