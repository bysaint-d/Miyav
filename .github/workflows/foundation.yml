name: foundation

on:
  push:
  pull_request:

jobs:
  jvm:
    name: Shared modules and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test shared modules and desktop
        run: ./gradlew test :desktop-app:test --no-daemon --stacktrace

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Lint, unit tests and debug APK
        run: ./gradlew :android-app:lintDebug :android-app:testDebugUnitTest :android-app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: miyav-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7
