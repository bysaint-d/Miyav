name: foundation

on:
  push:
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test shared modules and compile desktop
        run: ./gradlew test :desktop-app:compileJava --no-daemon --stacktrace
